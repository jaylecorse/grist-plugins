<html>
<head>
  <meta charset="utf-8">

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-org-chart@3.0.1"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-flextree@2.1.2/build/d3-flextree.js"></script>
  <script src="api.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Segoe UI, sans-serif;
    }

    #toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-bottom: 1px solid #ddd;
      background: white;
    }

    #toolbar h3 {
      margin: 0;
      flex: 1;
    }

    #toolbar input {
      width: 300px;
      padding: 6px;
    }

    #msg {
      color: red;
      padding: 10px;
    }

    .chart-container {
      width: 100%;
      height: calc(100vh - 60px);
    }

    #config-panel {
      position: fixed;
      top: 60px;
      right: 10px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
      width: 350px;
      padding: 15px;
      display: none;
      z-index: 1000;
    }

    .column-mapping-item {
      display: flex;
      margin-bottom: 12px;
      align-items: center;
    }

    .column-mapping-item label {
      width: 130px;
    }

    .column-mapping-item input {
      flex: 1;
    }
  </style>

</head>

<body>

<div id="toolbar">
  <h3 id="titre">Organigramme</h3>

  <input
      type="search"
      placeholder="Recherche nom ou fonction"
      oninput="filterChart(event)"
  >

  <span
      style="cursor:pointer;font-size:24px"
      onclick="clic(0)"
  >
      ⋯
  </span>
</div>

<div id="msg"></div>

<div class="chart-container"></div>

<div id="config-panel">

  <b>Configuration</b>

  <br><br>

  <div class="column-mapping-item">
    <label>Titre :</label>
    <input id="input-titre">
  </div>

  <div class="column-mapping-item">
    <label>Couleur :</label>
    <input id="input-couleur">
  </div>

  <div style="text-align:right">
    <button onclick="clic(1)">Enregistrer</button>
    <button onclick="clic(2)">Fermer</button>
  </div>

</div>

</body>
</html>
