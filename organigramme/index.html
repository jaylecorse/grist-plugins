<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organigramme</title>

  <script defer src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script defer src="https://d3js.org/d3.v7.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/d3-flextree@2.1.2/build/d3-flextree.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/d3-org-chart@3.0.1"></script>
  <script defer src="api.js"></script>

  <style>
    :root {
      --vignette: lightblue;
      --texte: #08011e;
      --texte-2: #4d4a57;          /* contraste >= 4.5:1 sur blanc et sur les pastels */
      --bordure: #cfccd6;
      --accent: #0b4f9c;
      --trouve: #c2185b;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--texte); }
    body { display: flex; flex-direction: column; padding: 8px 10px 0; gap: 6px; }

    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    button, select, input, textarea { font: inherit; }
    button { cursor: pointer; padding: 4px 10px; border: 1px solid var(--bordure); border-radius: 6px; background: #fff; color: var(--texte); }
    button:hover { background: #f1f0f5; }
    button.lien { border: 0; background: none; padding: 1px 0; color: var(--accent); text-decoration: underline; text-align: left; }

    /* ---------- En-tête et barre d'outils ---------- */
    header { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; }
    #titre { flex: 1 1 200px; margin: 0; font-size: 1.15rem; }
    .logos { display: flex; align-items: center; gap: 10px; }
    .logos img { max-height: 36px; max-width: 120px; object-fit: contain; }
    #recherche { width: 260px; max-width: 100%; padding: 4px 8px; }
    #btn-config { font-size: 1.2rem; font-weight: bold; line-height: 1; border-color: transparent; }

    #barre { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: .85rem; }
    #barre label { display: inline-flex; align-items: center; gap: 4px; }

    #legende { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0; padding: 0; list-style: none; font-size: .8rem; }
    #legende li { display: inline-flex; align-items: center; gap: 5px; }
    #legende i { width: 14px; height: 14px; border: 1px solid var(--bordure); border-radius: 3px; display: inline-block; }

    #statut { margin: 0; font-size: .8rem; color: var(--texte-2); min-height: 1em; }
    #msg { color: #b00020; white-space: pre-line; margin: 0; }
    #msg:empty { display: none; }

    .chart-container { flex: 1 1 auto; min-height: 0; }

    /* ---------- Vignette d'un agent ---------- */
    .org-node { height: 100%; padding: 4px 1px 14px; }
    .org-card {
      position: relative; display: flex; align-items: center; gap: 10px;
      height: 100%; padding: 8px 10px; overflow: hidden; cursor: pointer;
      background: var(--bg, var(--vignette)); border: 1px solid var(--bordure); border-radius: 10px;
    }
    .org-card.vacant { border-style: dashed; border-color: #6b6877; }
    .org-card.draft { border: 2px dashed var(--accent); }
    .org-card.trouve { outline: 3px solid var(--trouve); outline-offset: 1px; }
    .org-photo {
      position: relative; flex: 0 0 56px; width: 56px; height: 56px; border-radius: 50%; overflow: hidden;
      background: rgba(255, 255, 255, .7); display: flex; align-items: center; justify-content: center;
    }
    .org-initials { font-size: 18px; font-weight: 600; color: var(--texte-2); }
    .org-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .org-infos { min-width: 0; flex: 1; line-height: 1.25; }
    .org-nom { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .vacant .org-nom { font-style: italic; }
    .org-poste { font-size: 11px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .org-struct, .org-count { font-size: 10px; color: var(--texte-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .org-id { position: absolute; top: 3px; right: 8px; font-size: 9px; color: var(--texte-2); }
    .org-tag { position: absolute; bottom: 3px; right: 8px; font-size: 9px; padding: 0 5px; border-radius: 8px; background: #fff; border: 1px solid var(--accent); color: var(--accent); }

    /* ---------- Boîtes de dialogue ---------- */
    dialog { width: min(560px, calc(100% - 24px)); max-height: calc(100% - 24px); padding: 14px 16px; border: 1px solid #999; border-radius: 10px; color: var(--texte); }
    dialog::backdrop { background: rgba(0, 0, 0, .35); }
    dialog h2 { margin: 0 0 6px; font-size: 1.1rem; }
    dialog h3 { margin: 12px 0 4px; font-size: .95rem; }
    dialog dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; margin: 0; font-size: .9rem; }
    dialog dt { color: var(--texte-2); }
    dialog dd { margin: 0; overflow-wrap: anywhere; }
    dialog ul { margin: 0; padding-left: 18px; font-size: .9rem; }
    .vide { margin: 0; color: var(--texte-2); font-size: .9rem; }
    .fiche-tete { display: flex; gap: 12px; align-items: center; }
    .fiche-tete .org-photo { flex-basis: 80px; width: 80px; height: 80px; }
    .actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; margin-top: 14px; }
    .ligne { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
    .ligne label { width: 150px; flex: 0 0 auto; }
    .ligne input, .ligne textarea, .ligne select { flex: 1; min-width: 0; }

    /* ---------- Impression / PDF (paysage) ---------- */
    @page { size: A4 landscape; margin: 8mm; }
    @media print {
      #barre, #recherche, #btn-config, #statut, dialog { display: none !important; }
      html, body { height: auto; }
      .chart-container { height: auto; }
      .chart-container svg { max-width: 100%; height: auto; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>

<body>
  <header>
    <div class="logos"><img id="logo1" alt="Logo" hidden><img id="logo2" alt="Logo" hidden></div>
    <h1 id="titre">Organigramme</h1>
    <div role="search">
      <label class="sr-only" for="recherche">Rechercher un agent, un poste ou une structure</label>
      <input id="recherche" type="search" placeholder="Rechercher (nom, poste, structure…)" autocomplete="off">
    </div>
    <button id="btn-config" type="button" aria-label="Configuration" title="Configuration">⋯</button>
  </header>

  <div id="barre" role="toolbar" aria-label="Outils de l'organigramme">
    <label>Couleur par <select id="sel-mode"></select></label>
    <label>Sous-niveaux affichés
      <select id="sel-niveaux">
        <option value="0">0</option><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option>
        <option value="4">4</option><option value="tous">Tous</option>
      </select>
    </label>
    <button id="btn-deplier" type="button">Tout déplier</button>
    <button id="btn-replier" type="button">Tout replier</button>
    <button id="btn-ajuster" type="button">Ajuster à l'écran</button>
    <button id="btn-complet" type="button" hidden>Retour à l'organigramme complet</button>
    <button id="btn-export" type="button">Exporter…</button>
    <button id="btn-lexique" type="button" hidden>Lexique</button>
  </div>

  <ul id="legende" aria-label="Légende des couleurs"></ul>
  <p id="statut" role="status" aria-live="polite"></p>
  <div id="msg" role="alert"></div>
  <main class="chart-container"></main>

  <!-- Fiche agent -->
  <dialog id="dlg-fiche" aria-labelledby="fiche-titre"><div id="fiche"></div></dialog>

  <!-- Export -->
  <dialog id="dlg-export" aria-labelledby="export-titre">
    <h2 id="export-titre">Exporter</h2>
    <p>Structure : <b id="export-structure"></b></p>
    <div class="ligne">
      <label for="export-niveaux">Sous-niveaux :</label>
      <select id="export-niveaux">
        <option value="1">1</option><option value="2">2</option><option value="3">3</option>
        <option value="4">4</option><option value="tous" selected>Tous</option>
      </select>
    </div>
    <div class="actions">
      <button id="btn-export-csv" type="button">Format modifiable (CSV, ouvre dans Excel)</button>
      <button id="btn-export-pdf" type="button">Format non modifiable (PDF paysage)</button>
      <button type="button" data-action="fermer">Annuler</button>
    </div>
  </dialog>

  <!-- Lexique -->
  <dialog id="dlg-lexique" aria-labelledby="lexique-titre">
    <h2 id="lexique-titre">Lexique</h2>
    <div id="lexique-txt"></div>
    <div class="actions"><button type="button" data-action="fermer">Fermer</button></div>
  </dialog>

  <!-- Configuration -->
  <dialog id="dlg-config" aria-labelledby="config-titre">
    <h2 id="config-titre">Configuration</h2>
    <div class="ligne"><label for="input-titre">Titre :</label><input type="text" id="input-titre"></div>
    <div class="ligne"><label for="input-couleur">Couleur par défaut :</label><input type="text" id="input-couleur" placeholder="lightblue, #cce5ff…"></div>
    <div class="ligne"><label for="input-logo1">Logo 1 (URL) :</label><input type="url" id="input-logo1" placeholder="https://…"></div>
    <div class="ligne"><label for="input-logo2">Logo 2 (URL) :</label><input type="url" id="input-logo2" placeholder="https://…"></div>
    <div class="ligne"><label for="input-lexique">Lexique (règles de gestion) :</label><textarea id="input-lexique" rows="5"></textarea></div>
    <div class="actions">
      <button id="btn-ok" type="button">Enregistrer</button>
      <button type="button" data-action="fermer">Annuler</button>
    </div>
  </dialog>
</body>

</html>
