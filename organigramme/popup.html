<style>
    #popup {
      display: none;
      width: 400px;
      height: 300px;
      background-color: #fff;
      border: 1px solid #ccc;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      position: fixed; 
      top: 50%; 
      left: 50%; 
      transform: translate(-50%, -50%); 
      padding: 20px;
      text-align: left;
      z-index: 1000; 
    }

    #closeBtn {
      position: absolute;
      top: 10px;
      right: 10px; 
      font-size: 18px; 
      cursor: pointer;
      color: grey; 
    }
</style>

<div ondblclick="clicpopup(0)" style="cursor:pointer">cliclic</div>
<div id="popup">
    <span id="closeBtn"
    onclick="closePopup()">✖
    </span>
 
<h3 id="agentNom"></h3>
 
<img id="agentImage" width="100" style="border-radius:50%" />
 
<hr>
 
<p><b>Poste :</b> <span id="agentFonction"></span></p>
 
<p><b>Structure :</b> <span id="agentDirection"></span></p>
 
<p><b>Collectivité :</b> <span id="agentCollectivite"></span></p>
 
<p><b>Site :</b> <span id="agentSite"></span></p>
 
<p><b>Téléphone :</b> <span id="agentTelephone"></span></p>
 
<p><b>Mail :</b> <span id="agentMail"></span></p>
 
<p><b>SORH :</b> <span id="agentSorh"></span></p>
 
<p>
<a id="agentTeams"
target="_blank">
Ouvrir Teams
</a>
</p>
 
</div>
<script>
const popup = document.getElementById('popup');

function clicpopup(action) {
  popup.style.display = action==1 ? 'none' : 'block';
}

function closePopup() {
  document.getElementById("popup").style.display="none";
}
 </script>
